```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dark Maze</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: Georgia, "Times New Roman", serif;
            height: 100vh;
            overflow: hidden;
        }

        .menu {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background:
                radial-gradient(circle at center, #171717 0%, #070707 45%, #000 80%);
        }

        /* Fog */
        .fog {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.035), transparent 45%),
                radial-gradient(ellipse at 80% 30%, rgba(255,255,255,0.025), transparent 40%);
            animation: fogMove 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes fogMove {
            from {
                transform: translateX(-20px) scale(1);
            }
            to {
                transform: translateX(20px) scale(1.08);
            }
        }

        /* Title */
        h1 {
            position: relative;
            font-size: clamp(55px, 9vw, 120px);
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #ddd;
            text-shadow:
                0 0 5px #fff,
                0 0 20px #555,
                0 0 50px #222;
            animation: flicker 4s infinite;
            margin-bottom: 15px;
        }

        @keyframes flicker {
            0%, 18%, 20%, 22%, 63%, 64%, 100% {
                opacity: 1;
            }
            19%, 21%, 62% {
                opacity: 0.45;
            }
        }

        .subtitle {
            position: relative;
            color: #777;
            letter-spacing: 6px;
            font-size: 15px;
            margin-bottom: 55px;
            text-transform: uppercase;
        }

        /* Buttons */
        .buttons {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 280px;
        }

        button {
            height: 58px;
            background: rgba(10, 10, 10, 0.9);
            color: #ccc;
            border: 1px solid #444;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            background: #151515;
            color: white;
            border-color: #aaa;
            box-shadow:
                0 0 10px #333,
                inset 0 0 15px #111;
            transform: scale(1.03);
        }

        button:active {
            transform: scale(0.98);
        }

        .warning {
            position: absolute;
            bottom: 25px;
            color: #444;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Vignette */
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            box-shadow: inset 0 0 180px 80px #000;
        }

        /* Random creepy text */
        .creepy {
            position: absolute;
            bottom: 90px;
            color: #292929;
            font-size: 13px;
            letter-spacing: 4px;
            animation: creepyFade 6s infinite;
        }

        @keyframes creepyFade {
            0%, 70%, 100% {
                opacity: 0;
            }
            75%, 90% {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            h1 {
                letter-spacing: 5px;
            }

            .subtitle {
                letter-spacing: 3px;
            }

            .buttons {
                width: 75%;
            }
        }
    </style>
</head>

<body>

<div class="menu">

    <div class="fog"></div>

    <h1>THE DARK MAZE</h1>

    <div class="subtitle">
        There is no way out.
    </div>

    <div class="buttons">

        <!-- CHANGE THE FILENAME HERE IF NEEDED -->
        <button onclick="window.location.href='the_dark_maze.html'">
            ▶ Play Now
        </button>

        <button onclick="alert('You enter the maze... but something is already waiting for you.')">
            Continue
        </button>

        <button onclick="alert('Made by Mohammed Alkhafaji')">
            Credits
        </button>

    </div>

    <div class="creepy">
        IT KNOWS YOU ARE HERE
    </div>

    <div class="warning">
        ⚠ Headphones Recommended
    </div>

    <div class="vignette"></div>

</div>

</body>
</html>
```
